<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMIA - Red Familiar</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%2305070f%22 stroke=%22url(%23g)%22 stroke-width=%225%22/><defs><linearGradient id=%22g%22 x1=%220%25%22 y1=%220%25%22 x2=%22100%25%22 y2=%22100%25%22><stop offset=%220%25%22 stop-color=%22%233b82f6%22/><stop offset=%2250%25%22 stop-color=%22%23a855f7%22/><stop offset=%22100%25%22 stop-color=%22%23ec4899%22/></linearGradient></defs><text x=%2250%25%22 y=%2257%25%22 font-size=%2242%22 font-weight=%22900%22 fill=%22url(%23g)%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>D</text></svg>">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-principal: #05070f;
            --bg-tarjeta: rgba(13, 20, 38, 0.55);
            --bg-input: rgba(21, 31, 50, 0.7);
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --color-acento: #3b82f6;
            --color-morado: #a855f7;
            --color-rosa: #ec4899;
            --color-reaccion: #ff3366;
            --color-online: #10b981;
            --borde-suave: rgba(255, 255, 255, 0.07);
            --premium-gradiente: linear-gradient(135deg, #3b82f6, #a855f7, #ec4899);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

body {
    background-color: #030712;
    /* Crear una cuadrícula usando líneas sutiles repetidas */
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px; /* Tamaño de los cuadros */
    color: var(--texto-principal);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* Una capa extra con luces de neón difuminadas que se mueven al fondo */
body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1), transparent 50%);
    z-index: -1;
    animation: rotarLuces 25s linear infinite;
}

@keyframes rotarLuces {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
        /* SCREEN DE CARGA */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #05070f;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .splash-logo {
            font-size: 55px;
            font-weight: 950;
            letter-spacing: 6px;
            background: var(--premium-gradiente);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulsoNeon 1.5s infinite alternate;
        }

        @keyframes pulsoNeon {
            from { transform: scale(0.96); opacity: 0.7; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.3)); }
            to { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.6)); }
        }

        /* CABECERA MODERNA */
       header {
    /* Efecto cristal translúcido ultra limpio */
    background: rgba(10, 15, 30, 0.45); 
    
    /* Desenfoque de alta fidelidad para el fondo dinámico */
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    
    /* Borde inferior con degradado de neón muy sutil */
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    
    padding: 16px 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 20px;
    
    /* Sombra de profundidad para despegar la barra del contenido */
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    
    /* Animación oculta para generar un sutil reflejo de luz ambiental */
    animation: brilloCabecera 8s ease infinite alternate;
}

@keyframes brilloCabecera {
    0% {
        border-bottom-color: rgba(168, 85, 247, 0.2);
        box-shadow: 0 8px 32px rgba(168, 85, 247, 0.05);
    }
    50% {
        border-bottom-color: rgba(59, 130, 246, 0.2);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.05);
    }
    100% {
        border-bottom-color: rgba(236, 72, 153, 0.2);
        box-shadow: 0 8px 32px rgba(236, 72, 153, 0.05);
    }
}

        .logo-demia {
            font-size: 32px;
            font-weight: 950;
            letter-spacing: 2px;
            background: var(--premium-gradiente);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            cursor: pointer;
            filter: drop-shadow(0 2px 8px rgba(168, 85, 247, 0.3));
        }

        .header-acciones {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-header-home {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-header-home:hover { transform: scale(1.1); color: var(--color-morado); }

        .avatar-menu-trigger {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--color-morado);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar-menu-trigger:hover { transform: scale(1.08); }

        /* SECCIÓN DE HISTORIAS (ESTILO INSTAGRAM) */
        .historias-contenedor {
            display: flex;
            gap: 16px;
            padding: 12px 4px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .historias-contenedor::-webkit-scrollbar { display: none; }

        .historia-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            min-width: 68px;
        }

        .historia-anillo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--premium-gradiente);
            padding: 2.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .historia-item:hover .historia-anillo {
            transform: scale(1.05);
        }

        .historia-anillo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #05070f;
        }

        .historia-nombre {
            font-size: 11px;
            font-weight: 600;
            color: var(--texto-secundario);
            margin-top: 6px;
            text-transform: capitalize;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .punto-online {
            position: absolute;
            bottom: 22px;
            right: 4px;
            width: 12px;
            height: 12px;
            background-color: var(--color-online);
            border: 2.5px solid #05070f;
            border-radius: 50%;
            animation: parpadeoOnline 2s infinite;
        }

        @keyframes parpadeoOnline {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* CAJA DE CREACIÓN ESTILO INSTAGRAM FLUIDO */
        .crear-publicacion { 
            background: var(--bg-tarjeta); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; 
            padding: 18px; 
            border: 1px solid var(--borde-suave);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            margin-bottom: 20px; 
        }

        .crear-fila-principal {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .crear-avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .crear-publicacion textarea { 
            flex: 1;
            height: 50px; 
            background: transparent; 
            color: white; 
            border: none; 
            resize: none; 
            font-size: 15px; 
            outline: none; 
            padding-top: 8px;
        }

        .zona-subida-atractiva { 
            border: 1.5px dashed rgba(255, 255, 255, 0.12); 
            padding: 12px; 
            border-radius: 12px; 
            text-align: center; 
            background-color: rgba(255, 255, 255, 0.02); 
            cursor: pointer; 
            margin-bottom: 14px; 
            transition: all 0.2s; 
        }

        .zona-subida-atractiva:hover { border-color: var(--color-acento); background-color: rgba(59, 130, 246, 0.05); }
        .zona-subida-atractiva p { font-size: 12.5px; color: var(--texto-secundario); font-weight: 500; }
        .zona-subida-atractiva input { display: none; }

        .input-opciones { 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            padding-top: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .select-tipo-moderno-box {
            display: flex;
            gap: 8px;
        }

        .btn-tipo-opcion {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--borde-suave);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-secundario);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-tipo-opcion.activo {
            background: rgba(168, 85, 247, 0.15);
            color: var(--color-morado);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .btn-publicar { 
            background: var(--premium-gradiente); 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 13px; 
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25);
            transition: transform 0.2s;
        }

        .btn-publicar:hover { transform: scale(1.03); }

        /* FILTROS COMPACTOS */
        .barra-filtros-muro { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .barra-filtros-muro::-webkit-scrollbar { display: none; }
        .btn-filtro-muro { background-color: var(--bg-tarjeta); border: 1px solid var(--borde-suave); padding: 8px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600; color: var(--texto-secundario); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-filtro-muro.activo { background: var(--premium-gradiente); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }

        /* TARJETAS DE PUBLICACIÓN ESTILO ESMERILADO (GLASSMORPHIC) */
        .post-card { 
            background: var(--bg-tarjeta); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            margin-bottom: 20px; 
            border: 1px solid var(--borde-suave); 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s;
        }

        .post-card:hover {
            border-color: rgba(168, 85, 247, 0.25);
        }

        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
        .post-header-perfil { display: flex; align-items: center; gap: 10px; cursor: pointer; position: relative; }
        .post-header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .post-header h4 { margin: 0; font-size: 14px; font-weight: 700; text-transform: capitalize; }
        .btn-eliminar-post { background: none; border: none; color: var(--texto-secundario); cursor: pointer; font-size: 14px; padding: 4px; }
        .post-comentario { padding: 4px 16px 14px 16px; font-size: 14.5px; line-height: 1.5; color: #f1f5f9; }
        
        .post-media-contenedor { width: 100%; background-color: #020408; position: relative; }
        .post-media-contenedor img, .post-media-contenedor video { width: 100%; display: block; max-height: 440px; object-fit: contain; }
        
        .post-nota-estilo { 
            background: linear-gradient(135deg, #10162e, #290a3a); 
            color: white; 
            padding: 50px 24px; 
            text-align: center; 
            font-size: 17px; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        
        .post-contadores { display: flex; justify-content: space-between; padding: 12px 16px 6px 16px; font-size: 12px; color: var(--texto-secundario); font-weight: 500; }

        /* ACCIONES CON MICRO-INTERACCIÓN */
        .post-acciones-botones { display: flex; padding: 4px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .btn-accion { 
            background: transparent; border: none; padding: 10px; flex: 1; font-weight: 600; 
            color: var(--texto-secundario); cursor: pointer; border-radius: 10px; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;
        }
        .btn-accion:hover { background-color: rgba(255, 255, 255, 0.04); color: var(--texto-principal); }
        
        /* Efecto de brinco/escala en el corazón */
        .btn-corazon i { transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-corazon.reaccionado { color: var(--color-reaccion); }
        .btn-corazon.reaccionado i { transform: scale(1.22); }

        /* SECCIÓN COMENTARIOS */
        .seccion-comentarios { background-color: rgba(0, 0, 0, 0.12); padding: 12px 16px; }
        .lista-comentarios { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; max-height: 180px; overflow-y: auto; }
        .lista-comentarios::-webkit-scrollbar { width: 4px; }
        .lista-comentarios::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 10px; }
        
        .comentario-item { font-size: 13px; background-color: rgba(255, 255, 255, 0.02); padding: 8px 12px; border-radius: 12px; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.01); }
        .comentario-item strong { color: #f8fafc; margin-right: 6px; text-transform: capitalize; font-weight: 600; }
        
        .input-comentario-grupo { display: flex; gap: 8px; position: relative; }
        .input-comentario-grupo input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--borde-suave); background: var(--bg-input); color: white; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .input-comentario-grupo input:focus { border-color: var(--color-morado); }
        .btn-enviar-comentario { background-color: var(--color-acento); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* SIDEBAR LATERAL ELÉGANCE */
        .sidebar-demia {
            position: fixed; top: 0; right: -350px; width: 320px; height: 100vh; background: #070b16;
            box-shadow: -15px 0 45px rgba(0,0,0,0.75); z-index: 200; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px 24px; overflow-y: auto; border-left: 1px solid var(--borde-suave);
        }
        .sidebar-demia.abierto { right: 0; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid var(--borde-suave); padding-bottom: 16px; }
        .btn-cerrar-sidebar { font-size: 24px; cursor: pointer; color: var(--texto-secundario); }
        
        .perfil-info-box { text-align: center; margin-bottom: 25px; }
        .perfil-info-box img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 3px solid var(--color-morado); }
        .lbl-cambiar-avatar { display: inline-block; font-size: 11px; color: var(--color-acento); font-weight: 700; cursor: pointer; margin-top: 4px; border: 1px solid var(--color-acento); padding: 4px 10px; border-radius: 12px; }
        #input-avatar-fisco { display: none; }
        
        .seccion-interna-titulo { font-size: 11px; font-weight: 800; color: var(--texto-secundario); text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 10px 0; }
        .btn-hermano-menu { width: 100%; padding: 11px 14px; margin-bottom: 6px; background: var(--bg-input); border: 1px solid var(--borde-suave); border-radius: 10px; text-align: left; font-weight: 600; cursor: pointer; font-size: 13.5px; color: var(--texto-principal); transition: all 0.2s; }
        .btn-hermano-menu:hover { background: rgba(168, 85, 247, 0.12); color: var(--color-morado); border-color: rgba(168, 85, 247, 0.2); }
        
        .form-subida-sidebar select, .form-subida-sidebar input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--borde-suave); background: var(--bg-input); color: white; font-size: 13px; }
        .btn-subir-album { width: 100%; padding: 11px; background: var(--premium-gradiente); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-logout-sidebar { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.08); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 24px; }
        .btn-muro-global { width: 100%; padding: 12px; background: var(--premium-gradiente); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; text-align: center; display: block; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2); }

        /* VISTA DE AUTENTICACIÓN */
        .auth-container { display: none; justify-content: center; align-items: center; min-height: 90vh; padding: 20px; }
        .auth-card { 
            background: rgba(15, 22, 42, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            width: 100%; max-width: 410px; text-align: center; border: 1px solid var(--borde-suave); 
        }
        .auth-card h2 { font-size: 36px; font-weight: 950; background: var(--premium-gradiente); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        .auth-card input { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid var(--borde-suave); border-radius: 12px; background: var(--bg-input); color: white; outline: none; font-size: 15px; }
        .auth-card input:focus { border-color: var(--color-morado); }
        .auth-toggle { margin-top: 20px; font-size: 14px; color: var(--texto-secundario); cursor: pointer; }
        .auth-toggle strong { color: var(--color-morado); }
        .btn-auth { width: 100%; padding: 14px; background: var(--premium-gradiente); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }

        /* PLATAFORMA LAYOUT */
        .app-plat { display: none; }
        .layout-principal { max-width: 490px; margin: 16px auto; padding: 0 8px; }

        /* VISOR ÁLBUM */
        .contenedor-album-visual { display: none; background: var(--bg-tarjeta); padding: 20px; border-radius: 24px; border: 1px solid var(--borde-suave); margin-bottom: 20px; }
        .grid-fotos-album { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
        .foto-album-wrapper { position: relative; border-radius: 12px; overflow: hidden; }
        .foto-album-item { width: 100%; height: 130px; object-fit: cover; cursor: pointer; display: block; transition: transform 0.2s; }
        .foto-album-item:hover { transform: scale(1.04); }
        .btn-compartir-desde-album { position: absolute; bottom: 8px; right: 8px; background: rgba(5, 7, 15, 0.85); color: white; border: none; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; opacity: 0; transition: opacity 0.2s; backdrop-filter: blur(4px); }
        .foto-album-wrapper:hover .btn-compartir-desde-album { opacity: 1; }
        
        /* MODAL MAXIMIZADOR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(4, 5, 10, 0.97); z-index: 1000; justify-content: center; align-items: center; }
        .modal.abierto { display: flex; }
        .modal-contenido { max-width: 92%; max-height: 85vh; border-radius: 16px; box-shadow: 0 0 40px rgba(168, 85, 247, 0.2); }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">DEMIA</div>
        <div style="color: #64748b; font-size: 13px; font-weight: 500; margin-top: 15px; letter-spacing: 1px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="color: #a855f7;"></i> Configurando entorno premium...
        </div>
    </div>

    <div id="vista-auth" class="auth-container">
        <div class="auth-card">
            <h2 id="auth-titulo">DEMIA</h2>
            <input type="text" id="auth-usuario" style="display:none;" placeholder="Nombre de usuario familiar (angel, mari...)">
            <input type="email" id="auth-correo" placeholder="Correo electrónico">
            <input type="password" id="auth-clave" placeholder="Contraseña">
            <button class="btn-auth" id="btn-ejecutar-auth" onclick="manejarAutenticacion()">Ingresar</button>
            <p class="auth-toggle" id="btn-cambiar-modo" onclick="conmutarModoAuth()">¿No tienes cuenta? <strong>Regístrate aquí</strong></p>
        </div>
    </div>

    <div id="vista-app" class="app-plat">
        <header>
            <div class="logo-demia" onclick="irAlInicioMuro()">DEMIA</div>
            <div class="header-acciones">
                <button class="btn-header-home" onclick="irAlInicioMuro()" title="Muro Global"><i class="fa-solid fa-house"></i></button>
                <img src="" id="trigger-avatar" class="avatar-menu-trigger" onclick="conmutarSidebar(true)" alt="Menu">
            </div>
        </header>

        <div id="sidebar" class="sidebar-demia">
            <div class="sidebar-header">
                <h3>Menú Personal</h3>
                <span class="btn-cerrar-sidebar" onclick="conmutarSidebar(false)">&times;</span>
            </div>
            <button class="btn-muro-global" onclick="irAlInicioMuro()">Muro Semanal</button>
            <div class="perfil-info-box" id="box-perfil-data"></div>
            
            <div class="seccion-interna-titulo">Carpetas Familiares</div>
            <div id="lista-hermanos-album">
                <button class="btn-hermano-menu" onclick="abrirAlbumHermano('angel')">Álbum de Angel</button>
                <button class="btn-hermano-menu" onclick="abrirAlbumHermano('mari')">Álbum de Mari</button>
                <button class="btn-hermano-menu" onclick="abrirAlbumHermano('david')">Álbum de David</button>
                <button class="btn-hermano-menu" onclick="abrirAlbumHermano('israel')">Álbum de Israel</button>
                <button class="btn-hermano-menu" onclick="abrirAlbumHermano('elias')">Álbum de Elias</button>
            </div>

            <div class="seccion-interna-titulo">Añadir Recuerdos</div>
            <div class="form-subida-sidebar">
                <select id="subir-tipo-album">
                    <option value="individual">Individual (Privado)</option>
                    <option value="familiar">Familiar (Compartido)</option>
                </select>
                <input type="file" id="input-archivo-album" accept="image/*">
                <button class="btn-subir-album" onclick="subirFotoAlbumNube()">Subir Imagen</button>
            </div>
            <button class="btn-logout-sidebar" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="layout-principal">
            
            <div class="historias-contenedor" id="barra-historias-dinamica"></div>

            <div id="modulo-album-vista" class="contenedor-album-visual">
                <h3 id="titulo-album-abierto" style="margin: 0 0 14px 0; border-bottom: 1px solid var(--borde-suave); padding-bottom: 8px;">Álbum</h3>
                <div class="grid-fotos-album" id="grid-fotos-visor"></div>
            </div>

            <div id="modulo-muro-vista">
                
                <div class="crear-publicacion">
                    <div class="crear-fila-principal">
                        <img src="" id="crear-avatar-actual" class="crear-avatar-mini" alt="Tú">
                        <textarea id="post-texto" placeholder="¿Qué quieres contarle hoy a tu familia?" onkeydown="detectarIntroPost(event)"></textarea>
                    </div>
                    
                    <div class="zona-subida-atractiva" onclick="document.getElementById('post-archivo').click()">
                        <p id="texto-dropzone"><i class="fa-regular fa-image" style="color: #3b82f6; margin-right: 6px;"></i> Añadir fotografía o video</p>
                        <input type="file" id="post-archivo" accept="image/*, video/*" onchange="actualizarNombreArchivo(this)">
                    </div>
                    
                    <div class="input-opciones">
                        <div class="select-tipo-moderno-box">
                            <button class="btn-tipo-opcion activo" id="opt-fmt-multimedia" onclick="cambiarFormatoPostActivo('multimedia')">Multimedia</button>
                            <button class="btn-tipo-opcion" id="opt-fmt-nota" onclick="cambiarFormatoPostActivo('nota')">Nota de Texto</button>
                        </div>
                        <input type="hidden" id="post-formato" value="multimedia">
                        <button class="btn-publicar" onclick="crearPublicacionNube()">Publicar</button>
                    </div>
                </div>

                <div class="barra-filtros-muro">
                    <button class="btn-filtro-muro activo" onclick="filtrarMuro('todos', this)">Todos</button>
                    <button class="btn-filtro-muro" onclick="filtrarMuro('angel', this)">Angel</button>
                    <button class="btn-filtro-muro" onclick="filtrarMuro('mari', this)">Mari</button>
                    <button class="btn-filtro-muro" onclick="filtrarMuro('david', this)">David</button>
                    <button class="btn-filtro-muro" onclick="filtrarMuro('israel', this)">Israel</button>
                    <button class="btn-filtro-muro" onclick="filtrarMuro('elias', this)">Elias</button>
                </div>

                <div id="feed-social"></div>
            </div>
        </div>
    </div>

    <div id="ventana-modal" class="modal" onclick="this.classList.remove('abierto')">
        <img class="modal-contenido" id="imagen-maximizada">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABMNSOKZMsRVSBdogqhBDULQ2ArvyMr9A",
            authDomain: "demia-f9708.firebaseapp.com",
            projectId: "demia-f9708",
            storageBucket: "demia-f9708.firebasestorage.app",
            messagingSenderId: "1004088726819",
            appId: "1:1004088726819:web:ba2132e526491577816896"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActualGlobal = null;
        let modoLogin = true;
        let filtroUsuarioActual = "todos";
        let desvincularEscuchadorMuro = null;

        // MAPA ESTATICO INICIAL DE SEGURIDAD PARA AVATARES
        const avataresPrecarga = {
            angel: "https://www.w3schools.com/howto/img_avatar.png",
            mari: "https://www.w3schools.com/howto/img_avatar2.png",
            david: "https://www.w3schools.com/howto/img_avatar.png",
            israel: "https://www.w3schools.com/howto/img_avatar.png",
            elias: "https://www.w3schools.com/howto/img_avatar.png"
        };

        // ESCUCHADOR DE SESIÓN
        onAuthStateChanged(auth, async (user) => {
            const splash = document.getElementById("splash-screen");
            if (user) {
                usuarioActualGlobal = { 
                    email: user.email, 
                    nombre: user.displayName || user.email.split("@")[0] 
                };
                document.getElementById("vista-auth").style.display = "none";
                document.getElementById("vista-app").style.display = "block";
                
                await cargarAvataresDesdeServidor();
                await actualizarInterfazPerfil();
                construirBarraHistorias();
                desplegarFeed();
                
                setTimeout(() => {
                    splash.style.opacity = "0";
                    setTimeout(() => splash.style.visibility = "hidden", 400);
                }, 300);
            } else {
                usuarioActualGlobal = null;
                document.getElementById("vista-app").style.display = "none";
                document.getElementById("vista-auth").style.display = "flex";
                
                splash.style.opacity = "0";
                setTimeout(() => splash.style.visibility = "hidden", 400);
            }
        });

        async function cargarAvataresDesdeServidor() {
            try {
                const snap = await getDocs(collection(db, "avatares"));
                snap.forEach(d => {
                    const data = d.data();
                    if(data.usuario && data.foto) {
                        avataresPrecarga[data.usuario.toLowerCase()] = data.foto;
                    }
                });
            } catch(e) { console.log("Aviso de sincronización de avatares."); }
        }

        // CONSTRUCCIÓN DINÁMICA DE HISTORIAS SUPERIORES
        window.construirBarraHistorias = function() {
            const barra = document.getElementById("barra-historias-dinamica");
            if (!barra) return;
            
            const miembros = ["angel", "mari", "david", "israel", "elias"];
            let html = "";
            
            miembros.forEach(m => {
                const imgUrl = avataresPrecarga[m] || "https://www.w3schools.com/howto/img_avatar.png";
                html += `
                    <div class="historia-item" onclick="abrirAlbumHermano('${m}')">
                        <div class="historia-anillo">
                            <img src="${imgUrl}">
                        </div>
                        <div class="punto-online"></div>
                        <div class="historia-nombre">${m}</div>
                    </div>
                `;
            });
            barra.innerHTML = html;
        };

        window.cambiarFormatoPostActivo = function(formato) {
            document.getElementById("post-formato").value = formato;
            if(formato === 'multimedia') {
                document.getElementById("opt-fmt-multimedia").classList.add("activo");
                document.getElementById("opt-fmt-nota").classList.remove("activo");
            } else {
                document.getElementById("opt-fmt-nota").classList.add("activo");
                document.getElementById("opt-fmt-multimedia").classList.remove("activo");
            }
        };

        window.detectarIntroPost = function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                crearPublicacionNube();
            }
        };

        window.detectarIntroComentario = function(e, id, comentariosViejos) {
            if (e.key === "Enter") {
                e.preventDefault();
                agregarComentario(id, comentariosViejos);
            }
        };

        window.conmutarModoAuth = function() {
            modoLogin = !modoLogin;
            document.getElementById("auth-titulo").innerText = modoLogin ? "DEMIA" : "REGISTRO DEMIA";
            document.getElementById("auth-usuario").style.display = modoLogin ? "none" : "block";
            document.getElementById("btn-ejecutar-auth").innerText = modoLogin ? "Ingresar" : "Crear Cuenta";
            document.getElementById("btn-cambiar-modo").innerHTML = modoLogin ? 
                "¿No tienes cuenta? <strong>Regístrate aquí</strong>" : "¿Ya tienes cuenta? <strong>Inicia sesión</strong>";
        };

        window.manejarAutenticacion = async function() {
            const userText = document.getElementById("auth-usuario").value.trim().toLowerCase();
            const email = document.getElementById("auth-correo").value.trim();
            const clave = document.getElementById("auth-clave").value;

            if(!email || !clave) return alert("Por favor rellena los campos.");
            
            try {
                if (modoLogin) {
                    await signInWithEmailAndPassword(auth, email, clave);
                } else {
                    if(!userText) return alert("Escribe un nombre de usuario familiar.");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, clave);
                    userCredential.user.displayName = userText;
                    
                    await addDoc(collection(db, "avatares"), { 
                        usuario: userText, 
                        foto: "https://www.w3schools.com/howto/img_avatar.png" 
                    });
                    alert("¡Cuenta familiar creada con éxito!");
                    location.reload();
                }
            } catch (err) { alert("Error: " + err.message); }
        };

        window.logout = function() { signOut(auth).then(() => location.reload()); };

        async function actualizarInterfazPerfil() {
            const miFoto = avataresPrecarga[usuarioActualGlobal.nombre.toLowerCase()] || "https://www.w3schools.com/howto/img_avatar.png";
            document.getElementById("trigger-avatar").src = miFoto;
            document.getElementById("crear-avatar-actual").src = miFoto;
            
            document.getElementById("box-perfil-data").innerHTML = `
                <img src="${miFoto}">
                <h4 style="text-transform:capitalize; margin-top:5px;">${usuarioActualGlobal.nombre}</h4>
                <label class="lbl-cambiar-avatar" for="input-avatar-fisco">🔄 Cambiar mi Foto</label>
                <input type="file" id="input-avatar-fisco" accept="image/*">
            `;
            document.getElementById("input-avatar-fisco").onchange = function() { procesarCambioAvatar(this); };
        }

        async function procesarCambioAvatar(input) {
            const archivo = input.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                comprimirImagen(e.target.result, async function(imgComp) {
                    const snap = await getDocs(collection(db, "avatares"));
                    let encontradoId = null;
                    snap.forEach(d => { if(d.data().usuario === usuarioActualGlobal.nombre) encontradoId = d.id; });
                    
                    if(encontradoId) {
                        await updateDoc(doc(db, "avatares", encontradoId), { foto: imgComp });
                    } else {
                        await addDoc(collection(db, "avatares"), { usuario: usuarioActualGlobal.nombre, foto: imgComp });
                    }
                    
                    avataresPrecarga[usuarioActualGlobal.nombre.toLowerCase()] = imgComp;
                    alert("Foto de perfil sincronizada.");
                    await actualizarInterfazPerfil();
                    construirBarraHistorias();
                    desplegarFeed();
                });
            };
            lector.readAsDataURL(archivo);
        }

        window.conmutarSidebar = function(abrir) {
            const sidebar = document.getElementById("sidebar");
            if(abrir) sidebar.classList.add("abierto");
            else sidebar.classList.remove("abierto");
        };

        window.irAlInicioMuro = function() {
            conmutarSidebar(false);
            document.getElementById("modulo-album-vista").style.display = "none";
            document.getElementById("modulo-muro-vista").style.display = "block";
        };

        window.actualizarNombreArchivo = function(input) {
            document.getElementById("texto-dropzone").innerHTML = input.files.length > 0 ? 
                `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Seleccionado: ${input.files[0].name}` : 
                `<i class="fa-regular fa-image" style="color: #3b82f6;"></i> Añadir fotografía o video`;
        };

        window.filtrarMuro = function(usuario, boton) {
            filtroUsuarioActual = usuario;
            document.querySelectorAll('.btn-filtro-muro').forEach(b => b.classList.remove('activo'));
            if(boton) boton.classList.add('activo');
            desplegarFeed();
        };

        /* CONTROL TIEMPO REAL CON EXCELENTES MICRO-INTERACCIONES */
        window.desplegarFeed = function() {
            const feed = document.getElementById("feed-social");
            if (feed.innerHTML === "") {
                feed.innerHTML = `<div id="demia-loader" style="text-align:center; color:#64748b; margin-top:20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Sincronizando Muro...</div>`;
            }

            if (typeof desvincularEscuchadorMuro === "function") desvincularEscuchadorMuro();

            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));

            desvincularEscuchadorMuro = onSnapshot(q, async (snap) => {
                const loader = document.getElementById("demia-loader");
                if (loader) loader.remove();

                const tiempoLimiteSemana = 7 * 24 * 60 * 60 * 1000;
                const ahoraMs = Date.now();
                const postsValidos = [];

                snap.forEach(d => {
                    const data = d.data();
                    data.id = d.id;
                    if (ahoraMs - data.timestamp <= tiempoLimiteSemana) {
                        if (filtroUsuarioActual === "todos" || data.userNombre === filtroUsuarioActual) {
                            postsValidos.push(data);
                        }
                    }
                });

                if (postsValidos.length === 0) {
                    feed.innerHTML = `<div style="text-align:center; color:#64748b; margin-top:40px; font-size: 14px;">Muro despejado esta semana. ¡Comparte algo con tu familia!</div>`;
                    return;
                }

                const tarjetasExistentes = feed.querySelectorAll(".post-card");
                if (tarjetasExistentes.length === 0 || tarjetasExistentes.length !== postsValidos.length) {
                    feed.innerHTML = "";
                    for (const post of postsValidos) {
                        const cardNode = document.createElement("div");
                        cardNode.className = "post-card";
                        cardNode.id = `card-post-${post.id}`;
                        feed.appendChild(cardNode);
                        await actualizarTarjetaEspecifica(post);
                    }
                } else {
                    for (const post of postsValidos) {
                        await actualizarTarjetaEspecifica(post);
                    }
                }
            });
        };

        async function actualizarTarjetaEspecifica(post) {
            const cardNode = document.getElementById(`card-post-${post.id}`);
            if (!cardNode) return;

            const avatarActualizado = avataresPrecarga[post.userNombre.toLowerCase()] || "https://www.w3schools.com/howto/img_avatar.png";
            const totalLikes = post.likesLista?.length || 0;
            const yaReacciono = post.likesLista?.includes(usuarioActualGlobal.nombre);

            if (cardNode.innerHTML === "") {
                let mediaHTML = "";
                if (post.formato === "multimedia" && post.media) {
                    if (post.mediaType?.startsWith("video")) {
                        mediaHTML = `<div class="post-media-contenedor"><video src="${post.media}" controls></video></div>`;
                    } else {
                        mediaHTML = `<div class="post-media-contenedor"><img src="${post.media}" loading="lazy"></div>`;
                    }
                }

                let contenidoCentralHTML = post.formato === "nota" ? 
                    `<div class="post-nota-estilo">${post.texto}</div>` : 
                    `<div class="post-comentario">${post.texto}</div>${mediaHTML}`;

                let botonEliminarHTML = (post.userNombre === usuarioActualGlobal.nombre) ? 
                    `<button class="btn-eliminar-post" id="btn-del-${post.id}">🗑️</button>` : "";

                cardNode.innerHTML = `
                    <div class="post-header">
                        <div class="post-header-perfil" id="header-perfil-${post.id}">
                            <img src="${avatarActualizado}">
                            <h4>${post.userNombre}</h4>
                        </div>
                        ${botonEliminarHTML}
                    </div>
                    <div>${contenidoCentralHTML}</div>
                    <div class="post-contadores">
                        <span id="txt-likes-${post.id}">❤️ ${totalLikes} Me gusta</span>
                        <span id="txt-comments-${post.id}">💬 ${post.comentarios?.length || 0} comentarios</span>
                    </div>
                    <div class="post-acciones-botones">
                        <button class="btn-accion btn-corazon ${yaReacciono ? 'reaccionado' : ''}" id="btn-like-${post.id}">
                            <i class="${yaReacciono ? 'fa-solid' : 'fa-regular'} fa-heart"></i> Me gusta
                        </button>
                        <button class="btn-accion" id="btn-foc-comment-${post.id}">
                            <i class="fa-regular fa-comment"></i> Comentar
                        </button>
                    </div>
                    <div class="seccion-comentarios">
                        <div class="lista-comentarios" id="box-comments-${post.id}"></div>
                        <div class="input-comentario-grupo">
                            <input type="text" id="input-c-${post.id}" placeholder="Escribe un comentario...">
                            <button class="btn-enviar-comentario" id="btn-send-comment-${post.id}">Enviar</button>
                        </div>
                    </div>
                `;

                document.getElementById(`header-perfil-${post.id}`).onclick = () => abrirAlbumHermano(post.userNombre);
                if (post.userNombre === usuarioActualGlobal.nombre) {
                    document.getElementById(`btn-del-${post.id}`).onclick = () => eliminarPublicacion(post.id);
                }
                
                // REACCIÓN DE CORAZÓN ULTRA RÁPIDA
                document.getElementById(`btn-like-${post.id}`).onclick = function() {
                    const btn = this;
                    const txtLikes = document.getElementById(`txt-likes-${post.id}`);
                    const estaActivo = btn.classList.contains("reaccionado");
                    
                    if(estaActivo) {
                        btn.classList.remove("reaccionado");
                        btn.querySelector("i").className = "fa-regular fa-heart";
                        txtLikes.innerText = `❤️ ${Math.max(0, totalLikes - 1)} Me gusta`;
                    } else {
                        btn.classList.add("reaccionado");
                        btn.querySelector("i").className = "fa-solid fa-heart";
                        txtLikes.innerText = `❤️ ${totalLikes + 1} Me gusta`;
                    }
                    conmutarLikeLógica(post.id, post.likesLista || []);
                };

                document.getElementById(`btn-foc-comment-${post.id}`).onclick = () => document.getElementById(`input-c-${post.id}`).focus();
                document.getElementById(`btn-send-comment-${post.id}`).onclick = () => agregarComentario(post.id, post.comentarios || []);
            } else {
                document.getElementById("txt-likes-" + post.id).innerText = `❤️ ${totalLikes} Me gusta`;
                document.getElementById("txt-comments-" + post.id).innerText = `💬 ${post.comentarios?.length || 0} comentarios`;
                
                const btnLike = document.getElementById(`btn-like-${post.id}`);
                if (yaReacciono) {
                    btnLike.classList.add("reaccionado");
                    btnLike.querySelector("i").className = "fa-solid fa-heart";
                } else {
                    btnLike.classList.remove("reaccionado");
                    btnLike.querySelector("i").className = "fa-regular fa-heart";
                }
            }

            const inputComentario = document.getElementById(`input-c-${post.id}`);
            if (inputComentario) {
                inputComentario.onkeydown = (e) => detectarIntroComentario(e, post.id, post.comentarios || []);
            }

            let comentariosHTML = "";
            post.comentarios?.forEach(c => {
                comentariosHTML += `<div class="comentario-item"><strong>${c.autor}:</strong>${c.texto}</div>`;
            });
            document.getElementById(`box-comments-${post.id}`).innerHTML = comentariosHTML;
        }

        async function conmutarLikeLógica(id, listaVieja) {
            let listaNueva = [...listaVieja];
            const idx = listaNueva.indexOf(usuarioActualGlobal.nombre);
            if (idx !== -1) listaNueva.splice(idx, 1);
            else listaNueva.push(usuarioActualGlobal.nombre);
            await updateDoc(doc(db, "posts", id), { likesLista: listaNueva });
        }

        window.agregarComentario = async function(id, comentariosViejos) {
            const input = document.getElementById(`input-c-${id}`);
            if (!input.value.trim()) return;
            let arrNuevo = [...comentariosViejos, { autor: usuarioActualGlobal.nombre, texto: input.value.trim() }];
            await updateDoc(doc(db, "posts", id), { comentarios: arrNuevo });
            input.value = "";
        };

        window.eliminarPublicacion = async function(id) {
            if (confirm("¿Borrar post permanentemente?")) {
                await deleteDoc(doc(db, "posts", id));
                const nodo = document.getElementById(`card-post-${id}`);
                if(nodo) nodo.remove();
            }
        };

        window.crearPublicacionNube = async function() {
            const texto = document.getElementById("post-texto").value.trim();
            const archivo = document.getElementById("post-archivo").files[0];
            const formato = document.getElementById("post-formato").value;

            if(!texto && !archivo) return alert("Escribe un mensaje o añade un archivo multimedia.");

            if (archivo && formato === "multimedia") {
                const lector = new FileReader();
                lector.onload = function(e) {
                    comprimirImagen(e.target.result, async function(imgComp) {
                        await addDoc(collection(db, "posts"), {
                            userNombre: usuarioActualGlobal.nombre,
                            texto: texto,
                            media: imgComp,
                            mediaType: archivo.type,
                            formato: formato,
                            timestamp: Date.now(),
                            likesLista: [],
                            comentarios: []
                        });
                        limpiarFormPost();
                    });
                };
                lector.readAsDataURL(archivo);
            } else {
                await addDoc(collection(db, "posts"), {
                    userNombre: usuarioActualGlobal.nombre,
                    texto: texto,
                    media: null,
                    mediaType: null,
                    formato: formato,
                    timestamp: Date.now(),
                    likesLista: [],
                    comentarios: []
                });
                limpiarFormPost();
            }
        };

        function limpiarFormPost() {
            document.getElementById("post-texto").value = "";
            document.getElementById("post-archivo").value = "";
            document.getElementById("texto-dropzone").innerHTML = `<i class="fa-regular fa-image" style="color: #3b82f6;"></i> Añadir fotografía o video`;
            cambiarFormatoPostActivo('multimedia');
        }

        window.abrirAlbumHermano = async function(hermanoSeleccionado) {
            conmutarSidebar(false);
            document.getElementById("modulo-muro-vista").style.display = "none";
            const moduloAlbum = document.getElementById("modulo-album-vista");
            moduloAlbum.style.display = "block";
            document.getElementById("titulo-album-abierto").innerText = `Álbum de ${hermanoSeleccionado.toUpperCase()}`;
            
            let visorGrid = document.getElementById("grid-fotos-visor");
            visorGrid.innerHTML = `<p style="color:var(--texto-secundario); font-size:13px;">Abriendo almacenamiento en la nube...</p>`;
            
            try {
                const snap = await getDocs(collection(db, "albumes"));
                visorGrid.innerHTML = "";
                let conteo = 0;

                snap.forEach(d => {
                    const f = d.data();
                    if(f.hermano === hermanoSeleccionado) {
                        if(usuarioActualGlobal.nombre !== hermanoSeleccionado && f.tipo === "individual") return;
                        conteo++;
                        const wrapper = document.createElement("div");
                        wrapper.className = "foto-album-wrapper";
                        let botonCompartirHTML = (usuarioActualGlobal.nombre === hermanoSeleccionado) ? 
                            `<button class="btn-compartir-desde-album" id="btn-comp-alb-${d.id}">📢 Compartir</button>` : "";
                        
                        wrapper.innerHTML = `
                            <img src="${f.ruta}" class="foto-album-item" id="img-alb-${d.id}">
                            ${botonCompartirHTML}
                        `;
                        visorGrid.appendChild(wrapper);

                        document.getElementById(`img-alb-${d.id}`).onclick = () => ampliFoto(f.ruta);
                        if(usuarioActualGlobal.nombre === hermanoSeleccionado) {
                            document.getElementById(`btn-comp-alb-${d.id}`).onclick = () => publicarFotoDesdeAlbum(f.ruta);
                        }
                    }
                });

                if(conteo === 0) {
                    visorGrid.innerHTML = `<p style="color:var(--texto-secundario); font-size:13px; grid-column:1/-1;">Esta carpeta está vacía.</p>`;
                }
            } catch(e) { visorGrid.innerHTML = "Error al abrir álbum: " + e.message; }
        };

        window.publicarFotoDesdeAlbum = async function(base64Foto) {
            await addDoc(collection(db, "posts"), {
                userNombre: usuarioActualGlobal.nombre,
                texto: "¡Compartiendo un recuerdo directamente desde mi álbum personal! 📂✨",
                media: base64Foto,
                mediaType: "image/jpeg",
                formato: "multimedia",
                timestamp: Date.now(),
                likesLista: [],
                comentarios: []
            });
            alert("¡Publicada en el muro con éxito!");
            irAlInicioMuro();
        };

        window.subirFotoAlbumNube = async function() {
            const tipo = document.getElementById("subir-tipo-album").value;
            const archivo = document.getElementById("input-archivo-album").files[0];
            if (!archivo) return alert("Por favor selecciona una foto.");
            
            const lector = new FileReader();
            lector.onload = function(e) {
                comprimirImagen(e.target.result, async function(imgComp) {
                    await addDoc(collection(db, "albumes"), {
                        hermano: usuarioActualGlobal.nombre,
                        tipo: tipo,
                        ruta: imgComp,
                        creado: Date.now()
                    });
                    alert("¡Fotografía guardada con éxito!");
                    document.getElementById("input-archivo-album").value = "";
                    conmutarSidebar(false);
                    abrirAlbumHermano(usuarioActualGlobal.nombre);
                });
            };
            lector.readAsDataURL(archivo);
        };

        window.ampliFoto = function(src) {
            document.getElementById("imagen-maximizada").src = src;
            document.getElementById("ventana-modal").classList.add("abierto");
        };

        function comprimirImagen(base64Str, callback) {
            const img = new Image();
            img.src = base64Str;
            img.onload = function() {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;
                const MAX_WIDTH = 700;
                const MAX_HEIGHT = 700;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { height *= MAX_HEIGHT / height; width = MAX_HEIGHT; }
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL("image/jpeg", 0.65));
            };
        }
    </script>
</body>
</html>
